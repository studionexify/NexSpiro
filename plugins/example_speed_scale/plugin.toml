id = "speed_scale"
name = "Feature Speed Scale"
version = "0.1.0"
kind = "gcode"
api_version = 1
printers = []  # empty = all Bambu printers
category = "Motion"
description = "Scales feedrate (F) of moves belonging to one feature, e.g. 'Outer wall'."

[params.feature]
type = "str"
default = "Outer wall"
help = "Feature name as written in '; FEATURE:' comments"

[params.factor]
type = "float"
default = 0.8
min = 0.1
max = 3.0
help = "Feedrate multiplier"
