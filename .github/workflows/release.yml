# Builds desktop installers for Windows, macOS and Linux.
# - Every run uploads the installers as workflow artifacts (Actions tab → run → Artifacts).
# - Pushing a tag like v0.1.0 also publishes them on the repository's Releases page.
name: Desktop installers

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  # Create the release once, before the three builds upload into it (avoids racing duplicates).
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then echo "tag=$GITHUB_REF_NAME" >> $GITHUB_OUTPUT
          else node -e "console.log('tag=v'+require('./package.json').version)" >> $GITHUB_OUTPUT; fi
      - name: Remove a broken release named "v" left by an earlier run
        run: gh release delete v --cleanup-tag -y || true
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.v.outputs.tag }}
          target_commitish: ${{ github.sha }}

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win
          - os: macos-latest
            target: --mac
          - os: ubuntu-latest
            target: --linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx electron-builder ${{ matrix.target }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        continue-on-error: true # artifact storage can be full; tagged builds still publish to Releases
        with:
          name: NexSpiro-${{ runner.os }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
            release/*.deb
          if-no-files-found: error
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
            release/*.deb
