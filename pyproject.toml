[project]
name = "nexspiro"
version = "0.1.0"
description = "Nexspiro slicer plugin framework (Studio Nexify, in-house)"
requires-python = ">=3.11"
dependencies = ["PySide6>=6.6"]

[project.optional-dependencies]
mesh = ["trimesh>=4", "numpy"]
dev = ["pytest", "pyinstaller"]

[project.scripts]
nexspiro-plugin = "nexspiro.runner.cli:main"

[project.gui-scripts]
nexspiro = "nexspiro.ui.main_window:main"

[tool.setuptools.packages.find]
include = ["nexspiro*"]

[tool.setuptools.package-data]
"nexspiro.core" = ["printers.toml"]

[tool.pytest.ini_options]
pythonpath = ["."]
